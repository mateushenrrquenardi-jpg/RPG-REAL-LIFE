<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG da Vida Real - Mateus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260815-2">
</head>
<body>
  <main class="app-shell">
    <section class="hero-panel" aria-label="Status do personagem">
      <div class="hero-grid">
        <div class="avatar-frame">
          <img src="https://github.com/mateushenrrquenardi-jpg.png" alt="Avatar de Mateus" class="avatar">
          <span class="scanline"></span>
        </div>

        <div class="hero-copy">
          <p class="system-label">RPG Real Life</p>
          <h1>Mateus</h1>
          <p id="hero-class" class="hero-class">// Sincronizando...</p>
        </div>

        <button id="btn-new-day" class="btn btn-primary" type="button">
          Novo dia
        </button>
      </div>

      <div class="xp-block">
        <div class="xp-row">
          <span>EXP</span>
          <strong id="exp-val">- / -</strong>
        </div>
        <div class="xp-track" aria-label="Progresso de experiencia">
          <div id="exp-fill" class="xp-fill"></div>
        </div>
      </div>

      <div class="attribute-grid" aria-label="Atributos">
        <article class="attribute-card">
          <span>STR</span>
          <strong id="a-forca">-</strong>
          <small>Forca</small>
        </article>
        <article class="attribute-card">
          <span>MAG</span>
          <strong id="a-magia">-</strong>
          <small>Magia</small>
        </article>
        <article class="attribute-card">
          <span>CAR</span>
          <strong id="a-carisma">-</strong>
          <small>Carisma</small>
        </article>
        <article class="attribute-card">
          <span>INT</span>
          <strong id="a-intel">-</strong>
          <small>Inteligencia</small>
        </article>
      </div>
    </section>

    <nav class="tabs" aria-label="Navegacao principal">
      <button class="tab active" type="button" data-tab="quests">Quests</button>
      <button class="tab" type="button" data-tab="historico">Log</button>
    </nav>

    <section id="tab-quests" class="tab-panel active">
      <section class="panel" aria-label="Adicionar quest">
        <div class="panel-header">
          <h2>Nova quest</h2>
        </div>

        <form id="quest-form" class="quest-form">
          <label class="field">
            <span>Nome</span>
            <input id="q-nome" type="text" placeholder="Nome da quest..." autocomplete="off" required>
          </label>

          <div class="form-grid">
            <label class="field">
              <span>Tipo</span>
              <select id="q-tipo">
                <option value="side">Side quest (+10 EXP, +1)</option>
                <option value="principal">Missao principal (+30 EXP, +3)</option>
                <option value="diaria">Diaria (+10 EXP, +1)</option>
              </select>
            </label>

            <label class="field">
              <span>Atributo</span>
              <select id="q-atrib">
                <option value="forca">Forca</option>
                <option value="magia">Magia</option>
                <option value="carisma">Carisma</option>
                <option value="inteligencia">Inteligencia</option>
              </select>
            </label>
          </div>

          <button class="btn btn-secondary" type="submit">Adicionar quest</button>
        </form>
      </section>

      <section id="daily-section" class="panel daily-panel" aria-label="Quests diarias">
        <div class="panel-header">
          <div>
            <h2>Diarias de hoje</h2>
            <p id="daily-summary">Carregando protocolos diarios...</p>
          </div>
          <button id="btn-reset-dailies" class="btn btn-ghost" type="button">
            Resetar diarias
          </button>
        </div>
        <div id="daily-list" class="quest-list">
          <p class="state-text">Carregando...</p>
        </div>
      </section>

      <section class="panel" aria-label="Quests ativas">
        <div class="panel-header">
          <h2>Quests ativas</h2>
        </div>
        <div id="quest-list" class="quest-list">
          <p class="state-text">Carregando missoes...</p>
        </div>
      </section>
    </section>

    <section id="tab-historico" class="tab-panel">
      <section class="panel" aria-label="Historico">
        <div class="panel-header">
          <h2>Log de batalhas</h2>
        </div>
        <div id="hist-list" class="history-list">
          <p class="state-text">Carregando registros...</p>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260815-2"></script>
</body>
</html>
